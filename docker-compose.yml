services:
  library_back_service:
    container_name: 'library_back'
    build:
      context: .
    ports:
      - "8888:8000"
    networks:
      - myNetwork
    env_file:
      - .env

  library_celery_worker_service:
    container_name: 'library_celery_worker'
    build:
      context: .
    networks:
      - myNetwork
    env_file:
      - .env
    command: "celery --app=src.task.celery_app:celery_instance worker -l INFO"

  library_celery_beat_service:
    container_name: 'library_celery_beat'
    build:
      context: .
    networks:
      - myNetwork
    env_file:
      - .env
    command: "celery --app=src.task.celery_app:celery_instance beat -l INFO"

networks:
  myNetwork:
    external: True
